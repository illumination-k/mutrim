name: CI Go

# Markdown/docs formatting is covered by the base lint workflows, so
# docs-only changes skip this workflow entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  ci:
    # Go toolchain comes from mise and freshly generated repos build quickly,
    # so the cheaper 1-vCPU slim image is enough. Switch back to ubuntu-latest
    # if builds grow compute-heavy enough to outweigh the lower rate.
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_ENV: golang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          # Avoid GitHub API rate limits for aqua-backed tools
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: "${{ runner.os }}-go-${{ hashFiles('go.sum') }}"
          restore-keys: "${{ runner.os }}-go-"

      - name: Build
        run: go build ./...

      - name: CI
        run: mise run ci:golang
