name: CI Go

# Markdown/docs formatting is covered by the base lint workflows, so
# docs-only changes skip this workflow entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  ci:
    # Go toolchain comes from mise and freshly generated repos build quickly,
    # so the cheaper 1-vCPU slim image is enough. Switch back to ubuntu-latest
    # if builds grow compute-heavy enough to outweigh the lower rate.
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_ENV: golang
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        env:
          # Avoid GitHub API rate limits for aqua-backed tools
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: "${{ runner.os }}-go-${{ hashFiles('go.sum') }}"
          restore-keys: "${{ runner.os }}-go-"

      - name: Build
        run: go build ./...

      - name: CI
        run: mise run ci:golang
