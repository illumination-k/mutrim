name: CI Bazel

# Bazel builds are compute-bound (the Go SDK builds the standard library from
# source), so this runs on ubuntu-latest rather than the slim image.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MISE_ENV: bazel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          # Avoid GitHub API rate limits for aqua-backed tools
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Cache Bazel repositories and build results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: "${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'go.sum') }}"
          restore-keys: "${{ runner.os }}-bazel-"

      - name: Use the CI Bazel configuration
        run: echo "common --config=ci" >> ~/.bazelrc

      - name: CI
        run: mise run ci:bazel
